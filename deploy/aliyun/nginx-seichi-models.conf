# 圣地巡礼调色 · AI 模型与 onnxruntime-web 运行时的国内下载线路（阿里云）
#
# 放到 /etc/nginx/conf.d/ 下，改掉三处 models.example.cn 与证书路径后：
#   nginx -t && systemctl reload nginx
# 目录结构由 tools/sync-models-aliyun.sh 上传：
#   /srv/seichi/models/person-detect.onnx、isnet-anime-w8.onnx.part00 …
#   /srv/seichi/ort/1.19.2/ort.webgpu.mjs、ort-wasm-simd-threaded.jsep.wasm …

# 只允许调色站点跨域读取。本地调试时才需要 localhost 两行。
map $http_origin $seichi_cors_origin {
    default                      "";
    "https://compose.anitabi.cn" $http_origin;
    "https://anitabi.github.io"  $http_origin;
    "http://localhost:8126"      $http_origin;
    "http://127.0.0.1:8126"      $http_origin;
}

server {
    listen 80;
    server_name models.example.cn;   # ← 换成你的模型域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name models.example.cn;   # ← 换成你的模型域名

    # 阿里云「数字证书管理服务」免费证书，下载 Nginx 版本放到这里
    ssl_certificate     /etc/nginx/ssl/models.example.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/models.example.cn.key;

    root /srv/seichi;
    sendfile on;
    tcp_nopush on;
    # onnx / wasm 本身就是二进制，压缩几乎不省流量，还会去掉 Content-Length，网页的下载进度就没了
    gzip off;

    # 注意：location 里只要写了 add_header，就不会再继承外层的，所以两处各写全。
    location /models/ {
        types { }
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin  $seichi_cors_origin always;
        add_header Vary Origin always;
        # 网页开启了 COEP: require-corp（多线程推理需要），跨域资源必须带这个头
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location /ort/ {
        # .mjs 必须按 JavaScript 下发，否则浏览器拒绝当模块加载；.wasm 用于流式编译
        types {
            text/javascript  mjs js;
            application/wasm wasm;
        }
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin  $seichi_cors_origin always;
        add_header Vary Origin always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        # 路径里带版本号，内容不会变
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
